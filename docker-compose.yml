# Local dev only. Prod = two Dokploy apps (see docs/deployment.md).
services:
  proxy:
    image: nginx:1.30.1-alpine
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      portfolio_backend:
        condition: service_healthy
      portfolio_frontend:
        condition: service_healthy
    networks:
      - dokploy-network
      - portfolio_internal

  portfolio_backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-contacto@juansasia.com}
      - SECRET_KEY=${SECRET_KEY:-}
      - CLIENT_ID=${CLIENT_ID:-portfolio-client}
      - CLIENT_SECRET=${CLIENT_SECRET:-}
      - ENV=production
    volumes:
      - ./data:/app/data
    command: /app/entrypoint.sh
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      portfolio_internal:
        aliases:
          - portfolio_backend
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          memory: 1G

  portfolio_frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    depends_on:
      portfolio_backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=/api
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      portfolio_internal:
        aliases:
          - portfolio_frontend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          memory: 128M

networks:
  dokploy-network:
    external: true

  portfolio_internal:
    driver: bridge