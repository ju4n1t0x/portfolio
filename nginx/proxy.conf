# Local-dev only. Prod uses Dokploy/Traefik (see docs/deployment.md).
#
# Parity contract with prod: /api/* is forwarded AS-IS (no strip).
# Rate limiting lives in the backend (slowapi), not here.

server {
    listen 80;

    location ~ /\.env {
        deny all;
        return 404;
    }

    location ~ /\.(git|dockerignore) {
        deny all;
        return 404;
    }

    location ~ /requirements\.txt$ {
        deny all;
        return 404;
    }

    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 4 64k;

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        proxy_pass http://portfolio_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        proxy_pass http://portfolio_frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
